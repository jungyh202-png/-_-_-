<html lang="ko">

<meta charset="UTF-8">

<title>파주시 공영주차장 찾기</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
    :root {
        --primary-color: #0056b3;
        --accent-color: #fd7e14;
        --secondary-color: #f8f9fa;
        --border-color: #dee2e6;
        --text-color: #333;
    }
    body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f6; color: var(--text-color); margin: 0; padding: 0; }
    header { background-color: var(--primary-color); color: white; padding: 2.5rem 1rem; text-align: center; }
    header h1 { margin: 0 0 0.5rem 0; font-size: 2rem; }
    header p { margin: 0; font-size: 1.1rem; opacity: 0.9; }
    .container { max-width: 1100px; margin: -30px auto 2rem auto; padding: 0 1rem; }
    .filters { display: flex; gap: 1rem; margin-bottom: 1rem; background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-wrap: wrap; }
    .filter-group { display: flex; flex: 1; min-width: 200px; gap: 0.5rem; }
    .filters select, .filters input { flex: 1; min-width: 150px; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; outline: none; }
    .filters select { cursor: pointer; }
    .filters select:focus, .filters input:focus { border-color: var(--primary-color); }
    .search-btn { padding: 0.8rem 1.2rem; border: none; border-radius: 6px; background-color: var(--primary-color); color: white; font-size: 1rem; cursor: pointer; white-space: nowrap; }
    .search-btn:hover { background-color: #003d80; }
    .result-count { margin: 0 0 1rem 4px; color: #555; font-size: 0.95rem; }
    .restaurant-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .group-header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; background-color: var(--primary-color); color: white; padding: 0.9rem 1.3rem; border-radius: 8px; margin-top: 1rem; font-size: 1.15rem; font-weight: bold; }
    .group-header:first-child { margin-top: 0; }
    .group-count { font-size: 0.9rem; font-weight: 500; opacity: 0.9; }
    .card { background: white; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s; border: 1px solid transparent; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-color: var(--primary-color); }
    .card h3 { margin: 0 0 0.8rem 0; color: #222; font-size: 1.3rem; }
    .card p { margin: 0.3rem 0; font-size: 0.95rem; color: #555; line-height: 1.4; }
    .badge-container { margin-bottom: 1rem; }
    .badge { display: inline-block; padding: 0.3rem 0.7rem; font-size: 0.8rem; font-weight: bold; border-radius: 20px; color: white; margin-right: 0.4rem; }
    .badge.category-main { background-color: var(--primary-color); }
    .badge.category-temp { background-color: #6c757d; }
    .badge.fee-free { background-color: #28a745; }
    .badge.fee-paid { background-color: var(--accent-color); }
    .price-box { background-color: #eef4fb; border: 1px solid #cfe0f5; border-radius: 8px; padding: 0.7rem 0.9rem; margin: 0.8rem 0 0.3rem 0; }
    .price-box .price-label { display: block; font-size: 0.8rem; font-weight: bold; color: var(--primary-color); margin-bottom: 0.3rem; }
    .price-box .price-items { font-size: 0.92rem; color: #444; line-height: 1.55; }
    .phone-line { font-size: 0.9rem; color: #555; margin-top: 0.5rem; }
    .no-result { grid-column: 1 / -1; text-align: center; padding: 3rem; color: #777; background: white; border-radius: 10px; font-size: 1.1rem; }
    .map-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 0.8rem;
        padding: 0.5rem 0.9rem;
        background-color: #03c75a;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background-color 0.2s;
    }
    .map-btn:hover { background-color: #02a94e; }
    footer.note { max-width: 1100px; margin: 0 auto 2rem auto; padding: 0 1rem; font-size: 0.85rem; color: #888; }
</style>
</head>

<header>
    <h1>파주시 공영주차장</h1>
    <p id="subTitle">공영주차장 현황</p>
</header>

<div class="container">
    <div class="filters">
        <div class="filter-group">
            <input type="text" id="searchInput" placeholder="🔍 주차장명 검색">

                <option value="적성">적성</option>
                <option value="파평">파평</option>
                <option value="장단">장단</option>
                <option value="파주">파주</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="categoryFilter" onchange="filterData()">
                <option value="all">🅿️ 구분 전체</option>
                <option value="공영주차장">공영주차장</option>
                <option value="임시공영주차장">임시공영주차장</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="feeFilter" onchange="filterData()">
                <option value="all">💰 요금 전체</option>
                <option value="무료">무료</option>
                <option value="유료">유료</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="groupFilter" onchange="filterData()">
                <option value="none">📋 묶어보기 없음</option>
                <option value="region" selected>📍 지역별로 묶어보기</option>
                <option value="category">🅿️ 구분별로 묶어보기</option>
            </select>
        </div>
    </div>

    <div class="result-count" id="resultCount"></div>

    <div id="restaurantList" class="restaurant-list">
        <!-- JS를 통해 카드가 렌더링됩니다 -->
    </div>
</div>

<footer class="note">

    // 지역/구분 표시 순서
    const regionOrder = ["운정", "금촌", "문산", "탄현", "교하", "조리", "법원", "광탄", "월롱", "적성", "파평", "장단", "파주"];
    const categoryOrder = ["공영주차장", "임시공영주차장"];
    const regionLabels = { "금촌": "금촌/금릉" };

    // 카드 1개 렌더링용 HTML 생성 (주차장명 기반 네이버 지도 검색 링크)
    function createCard(item) {
        // 주차장명 + 지역명을 함께 검색어로 사용해 동명 시설 혼동을 줄임
        const mapQuery = `${item.name} 주차장 파주 ${item.region}`;
        const encodedQuery = encodeURIComponent(mapQuery);
        const naverMapUrl = `https://map.naver.com/p/search/${encodedQuery}`;
        const categoryBadgeClass = item.category === "공영주차장" ? "category-main" : "category-temp";
        const feeBadgeClass = item.fee === "무료" ? "fee-free" : "fee-paid";
        const spotHtml = (item.spot && item.spot !== "-")
            ? `<p class="phone-line">📌 ${item.spot}</p>`
            : '';
        const builtHtml = (item.built && item.built !== "-")
            ? `<p class="phone-line">🛠️ 조성 ${item.built}</p>`
            : '';

        return `
            <div class="card">
                <div class="badge-container">
                    <span class="badge ${categoryBadgeClass}">${item.category}</span>
                    <span class="badge ${feeBadgeClass}">${item.fee}</span>
                </div>
                <h3>${item.name}</h3>
                <p>${item.address}</p>
                <div class="price-box">
                    <span class="price-label">🅿️ 규모</span>
                    <span class="price-items">면적 ${item.area}㎡ · ${item.spaces}면</span>
                </div>
                ${spotHtml}
                ${builtHtml}
                <a class="map-btn" href="${naverMapUrl}" target="_blank" rel="noopener noreferrer">
                    🗺️ 네이버 지도에서 위치 보기
                </a>
            </div>
        `;
    }

    // 검색어/지역/구분/요금 조건에 맞춰 필터링 후 화면 갱신
    function filterData() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const region = document.getElementById('regionFilter').value;
        const category = document.getElementById('categoryFilter').value;
        const fee = document.getElementById('feeFilter').value;
        const group = document.getElementById('groupFilter').value;

        const filtered = restaurants.filter(item => {
            const matchKeyword = keyword === '' || item.name.toLowerCase().includes(keyword);
            const matchRegion = region === 'all' || item.region === region;
            const matchCategory = category === 'all' || item.category === category;
            const matchFee = fee === 'all' || item.fee === fee;
            return matchKeyword && matchRegion && matchCategory && matchFee;
        });

        // 그룹 내 정렬은 상호명 가나다순
        filtered.sort((a, b) => a.name.localeCompare(b.name, 'ko'));

        renderList(filtered, group);
    }

    // 리스트 렌더링 및 결과 수, 총 면수 표시 (묶어보기 지원)
    function renderList(list, group = 'none') {
        const listEl = document.getElementById('restaurantList');
        const countEl = document.getElementById('resultCount');

        const totalSpaces = list.reduce((sum, item) => sum + item.spaces, 0);
        countEl.textContent = `총 ${list.length}개소 검색됨 · ${totalSpaces.toLocaleString()}면 (전체 ${restaurants.length}개소 중)`;

        if (list.length === 0) {
            listEl.innerHTML = '<div class="no-result">검색 조건에 맞는 주차장이 없습니다.</div>';
            return;
        }

        // 묶어보기 없음: 평면 리스트 (가나다순)
        if (group === 'none') {
            listEl.innerHTML = list.map(createCard).join('');
            return;
        }

        // 지역별 또는 구분별로 묶어서 섹션 헤더와 함께 렌더링
        const field = group === 'region' ? 'region' : 'category';
        const baseOrder = group === 'region' ? regionOrder : categoryOrder;

        // 정해진 순서에 없는 값이 데이터에 있어도 누락되지 않도록 뒤에 덧붙임
        const extraKeys = [...new Set(list.map(item => item[field]))].filter(k => !baseOrder.includes(k));
        const keyOrder = [...baseOrder, ...extraKeys];

        let html = '';
        keyOrder.forEach(key => {
            const items = list.filter(item => item[field] === key);
            if (items.length === 0) return;
            const label = group === 'region' ? (regionLabels[key] || key) : key;
            const groupSpaces = items.reduce((sum, item) => sum + item.spaces, 0);
            html += `<div class="group-header"><span>${label}</span><span class="group-count">${items.length}개소 · ${groupSpaces.toLocaleString()}면</span></div>`;
            html += items.map(createCard).join('');
        });
        listEl.innerHTML = html;
    }

    // 엔터 키로도 검색 가능하도록 처리
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') filterData();
    });

    // 페이지 최초 로드: 헤더 개수 자동 표시 + 지역별 묶어보기(기본값)로 전체 목록 표시
    window.addEventListener('DOMContentLoaded', () => {
        const totalSpaces = restaurants.reduce((sum, item) => sum + item.spaces, 0);
        document.getElementById('subTitle').textContent = `공영주차장 현황 · 총 ${restaurants.length}개소 ${totalSpaces.toLocaleString()}면 수록`;
        filterData();
    });
</script>
